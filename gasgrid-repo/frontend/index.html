const COL=['#f5b301','#7fb3d5','#82e0aa','#f1948a','#bb8fce','#f8c471','#85c1e9','#a3e4d7'];
const nums=(s,lo,hi,max,name)=>{const a=String(s).trim().split(/[\s,]+/).filter(Boolean).map(Number);if(!a.length||a.length>max||a.some(x=>!Number.isInteger(x)||x<lo||x>hi))throw `${name}: enter 1-${max} whole numbers between ${lo} and ${hi}`;return a};
const mat=(s,cols,name)=>{const r=String(s).trim().split('\n').map(l=>l.trim().split(/[\s,]+/).map(Number));if(!r.length||r.length>12||r.some(x=>x.length!=cols||x.some(y=>!Number.isInteger(y)||y<0||y>1e6)))throw `${name}: each row needs ${cols} whole numbers (0 or more), max 12 rows`;return r};
const parseProcs=s=>{const r=String(s).trim().split('\n').map(l=>l.trim().split(/\s+/).map(Number));if(!r.length||r.length>30||r.some(x=>x.length!=4||x.some(y=>!Number.isInteger(y)||y<0)||x[2]<1))throw 'Each line: pid arrival burst(1+) priority, whole numbers, max 30 processes';if(new Set(r.map(x=>x[0])).size!=r.length)throw 'Process IDs must be unique';return r.map(x=>({pid:x[0],arrival:x[1],burst:x[2],priority:x[3]}))};
function cpuSim(a,P,q){const n=P.length,p=P.map(x=>({...x,rem:x.burst,st:-1,ct:-1,lvl:0})),G=[];
 const rr=a=='RR',mlq=a=='MLQ',mlfq=a=='MLFQ',ml=mlq||mlfq,queued=rr||ml,pre=a=='SRTF'||a=='PRIORITY_P',sj=a=='SJF'||a=='SRTF',pri=a.startsWith('PRIORITY');
 const qt=[ml?2:q,ml?4:1e9,1e9],Q=[[],[],[]],seen=new Set();let t=0,cur=-1,used=0,done=0;
 p.forEach(x=>x.lvl=mlq?(x.priority<=1?0:x.priority==2?1:2):0);
 const seg=(pid,s,e)=>{const l=G[G.length-1];if(l&&l.pid==pid&&l.e==s)l.e=e;else G.push({pid,s,e})};
 const arrive=()=>p.forEach((x,i)=>{if(!seen.has(i)&&x.arrival<=t){seen.add(i);if(queued)Q[x.lvl].push(i)}});
 while(done<n&&t<20000){arrive();
  if(queued){if(cur>=0)for(let k=0;k<p[cur].lvl;k++)if(Q[k].length){Q[p[cur].lvl].unshift(cur);cur=-1;break}
   if(cur<0)for(let k=0;k<3;k++)if(Q[k].length){cur=Q[k].shift();used=0;break}}
  else if(cur<0||pre){let b=-1;const key=x=>sj?x.rem:pri?x.priority:x.arrival;p.forEach((x,i)=>{if(x.arrival>t||x.rem<=0)return;if(b<0){b=i;return}if(key(x)<key(p[b]))b=i});cur=b}
  if(cur<0){seg(-1,t,t+1);t++;continue}
  const x=p[cur];if(x.st<0)x.st=t;seg(x.pid,t,t+1);x.rem--;t++;used++;if(queued)arrive();
  if(x.rem==0){x.ct=t;done++;cur=-1}else if(queued&&used>=qt[x.lvl]){if(mlfq&&x.lvl<2)x.lvl++;Q[x.lvl].push(cur);cur=-1}}
 const R=p.map(x=>({pid:x.pid,ct:x.ct,tat:x.ct-x.arrival,wt:x.ct-x.arrival-x.burst,rt:x.st-x.arrival})),busy=G.filter(g=>g.pid>=0).reduce((s,g)=>s+g.e-g.s,0),av=k=>R.reduce((s,r)=>s+r[k],0)/n;
 return{G,R,wt:av('wt'),tat:av('tat'),rt:av('rt'),util:busy/t*100,thr:n/t}}
function fit(a,holes,jobs){const h=[...holes];const out=jobs.map((j,i)=>{let b=-1;for(let k=0;k<h.length;k++){if(h[k]<j)continue;if(b<0||(a=='BEST'&&h[k]<h[b])||(a=='WORST'&&h[k]>h[b]))b=k;if(a=='FIRST')break}if(b>=0)h[b]-=j;return{job:i,size:j,hole:b,left:b<0?0:h[b]}});return{out,h}}
function pr(a,ref,F){const fr=[],cnt={},ld={},lt={},rb=[];let ptr=0,faults=0;const S=[];
 ref.forEach((pg,i)=>{const hit=fr.indexOf(pg);
  if(hit>=0){cnt[pg]++;ld[pg]=i;if(a=='CLOCK')rb[hit]=1}
  else{faults++;let idx=0;
   if(fr.length<F){idx=fr.length;ptr=(idx+1)%F}
   else if(a=='FIFO'){idx=ptr;ptr=(ptr+1)%F}
   else if(a=='CLOCK'){while(rb[ptr]){rb[ptr]=0;ptr=(ptr+1)%F}idx=ptr;ptr=(ptr+1)%F}
   else{let best=-Infinity;fr.forEach((p,j)=>{let k;if(a=='LRU')k=-ld[p];else if(a=='OPT'){const nx=ref.indexOf(p,i+1);k=nx<0?1e9:nx}else if(a=='LFU')k=-cnt[p]*1e5-lt[p];else k=cnt[p]*1e5-lt[p];if(k>best){best=k;idx=j}})}
   fr[idx]=pg;cnt[pg]=1;ld[pg]=i;lt[pg]=i;rb[idx]=1}
  S.push({pg,fr:[...fr],fault:hit<0})});return{S,faults}}
function disk(a,q,h,max,dir){const up=q.filter(x=>x>=h).sort((x,y)=>x-y),lo=q.filter(x=>x<h).sort((x,y)=>y-x),loA=[...lo].reverse(),upD=[...up].reverse(),u=dir=='up';let p=[h];
 if(a=='FCFS')p.push(...q);
 else if(a=='SSTF'){const r=[...q];let c=h;while(r.length){let k=0;r.forEach((x,i)=>{if(Math.abs(x-c)<Math.abs(r[k]-c))k=i});c=r.splice(k,1)[0];p.push(c)}}
 else if(a=='SCAN')p.push(...(u?[...up,max,...lo]:[...lo,0,...up]));
 else if(a=='CSCAN')p.push(...(u?[...up,max,0,...loA]:[...lo,0,max,...upD]));
 else if(a=='LOOK')p.push(...(u?[...up,...lo]:[...lo,...up]));
 else p.push(...(u?[...up,...loA]:[...lo,...upD]));
 return{p,mv:p.reduce((s,x,i)=>i?s+Math.abs(x-p[i-1]):0,0)}}
function safety(av,mx,al){const n=al.length,need=mx.map((r,i)=>r.map((x,j)=>x-al[i][j]));let w=[...av],fin=Array(n).fill(false),seq=[],pg=true;
 while(pg){pg=false;for(let i=0;i<n;i++)if(!fin[i]&&need[i].every((x,j)=>x<=w[j])){w=w.map((x,j)=>x+al[i][j]);fin[i]=true;seq.push(i);pg=true}}return{safe:fin.every(Boolean),seq,need}}
function detect(av,al,rq){const n=al.length;let w=[...av];const fin=al.map(r=>r.every(x=>x==0));let pg=true;
 while(pg){pg=false;for(let i=0;i<n;i++)if(!fin[i]&&rq[i].every((x,j)=>x<=w[j])){w=w.map((x,j)=>x+al[i][j]);fin[i]=true;pg=true}}return fin.map((f,i)=>f?-1:i).filter(i=>i>=0)}
function cycle(n,edges){const adj=Array.from({length:n},()=>[]);edges.forEach(([a,b])=>adj[a].push(b));const col=Array(n).fill(0),st=[];let res=null;
 const dfs=u=>{col[u]=1;st.push(u);for(const v of adj[u]){if(col[v]==1){res=st.slice(st.indexOf(v));return true}if(col[v]==0&&dfs(v))return true}col[u]=2;st.pop();return false};
 for(let i=0;i<n&&!res;i++)if(!col[i])dfs(i);return res}
function raceSim(s,safe){const t=[];let sold,fin;
 if(!safe){t.push(`T1 reads stock=${s}`,`T2 reads stock=${s}`,`T1 writes stock=${s-1}, booking confirmed`,`T2 writes stock=${s-1}, booking confirmed`);sold=2;fin=s-1}
 else{t.push('T1 acquires mutex',`T1 reads ${s}, writes ${s-1}, booking confirmed`,'T1 releases mutex','T2 acquires mutex');if(s>=2){t.push(`T2 reads ${s-1}, writes ${s-2}, booking confirmed`);sold=2;fin=s-2}else{t.push('T2 reads 0: booking rejected, out of stock');sold=1;fin=0}t.push('T2 releases mutex')}
 return{t,sold,fin,over:sold>s,lost:fin!=s-sold}}
function semSim(v,ops){const t=[];let w=0,id=0;for(const c of ops){if(c=='P'){id++;if(v>0){v--;t.push(`P: booking B${id} gets a cylinder (units left ${v})`)}else{w++;t.push(`P: booking B${id} BLOCKED (waiting ${w})`)}}else if(c=='V'){if(w>0){w--;t.push(`V: delivery done, a blocked booking wakes (waiting ${w})`)}else{v++;t.push(`V: unit released (units ${v})`)}}else throw 'Use only P and V'}return{t,v,w}}
function pcSim(cap,ops){const t=[];let c=0,p=0,k=0;for(const x of ops){if(x=='P'){if(c==cap)t.push(`Producer BLOCKED: buffer full ${c}/${cap}`);else{c++;p++;t.push(`Produced R${p} (${c}/${cap})`)}}else if(x=='C'){if(!c)t.push('Consumer BLOCKED: buffer empty');else{c--;k++;t.push(`Dispatcher consumed R${k} (${c}/${cap})`)}}else throw 'Use only P and C'}return{t,c,p,k}}
function lockSim(mode,N){const t=[];let flag=[0,0],turn=0,lock=0,st=[0,0],it=[0,0],tmp=[0,0],cnt=0,inn=0,viol=0,steps=0,ent=0;
 while((it[0]<N||it[1]<N)&&steps<1e6)for(let i=0;i<2;i++){if(it[i]>=N)continue;steps++;const o=1-i;
  if(mode=='peterson'){switch(st[i]){case 0:flag[i]=1;st[i]=1;break;case 1:turn=o;st[i]=2;break;case 2:if(flag[o]&&turn==o)break;st[i]=3;inn++;if(inn>1)viol++;if(ent++<8)t.push(`step ${steps}: P${i} enters critical section`);break;case 3:tmp[i]=cnt;st[i]=4;break;case 4:cnt=tmp[i]+1;st[i]=5;break;case 5:flag[i]=0;inn--;it[i]++;st[i]=0}}
  else{switch(st[i]){case 0:if(mode=='none'||lock==0){lock=1;st[i]=1;inn++;if(inn>1)viol++;if(ent++<8)t.push(`P${i} ${mode=='none'?'enters with NO protection':mode=='tas'?'TestAndSet(lock) returned 0 and enters':'CompareAndSwap(lock,0,1) succeeded and enters'}`)}break;case 1:tmp[i]=cnt;st[i]=2;break;case 2:cnt=tmp[i]+1;st[i]=3;break;case 3:lock=0;inn--;it[i]++;st[i]=0}}}
 return{t,cnt,exp:2*N,viol}}
function rwSim(seq){const t=[];let r=0,w=0,k=0;while(k<seq.length){if(seq[k]=='R'){let c=0;while(seq[k]=='R'){c++;k++;r++}t.push(`${c} reader(s) read the stock report concurrently`)}else if(seq[k]=='W'){w++;k++;t.push(`Writer W${w} has exclusive access; readers wait`)}else throw 'Use only R and W'}return{t,r,w}}
function dineSim(n,strat,rounds){const t=[];let meals=0,dead=false;

 else for(let rd=0;rd<rounds;rd++){const own=Array(n).fill(-1),held=Array(n).fill(0);let pg=true;while(pg){pg=false;for(let i=0;i<n;i++){const f=Math.min(i,(i+1)%n),s=Math.max(i,(i+1)%n);if(held[i]==0&&own[f]<0){own[f]=i;held[i]=1;pg=true}else if(held[i]==1&&own[s]<0){meals++;t.push(`Round ${rd+1}: philosopher ${i} eats (forks ${f},${s})`);own[f]=-1;held[i]=2;pg=true}}}}

async function doLogin(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value,L=LOCK[e];
 if(L&&L.n>=5&&Date.now()-L.t<3e5)return fmsg('Too many failed attempts. Try again in 5 minutes.');
 const u=DB.users.find(x=>x.email.toLowerCase()==e);
 if(!u||!(await vpw(p,u.pw))){LOCK[e]={n:(L&&Date.now()-L.t<3e5?L.n:0)+1,t:Date.now()};return fmsg('Invalid email or password')}

async function doRegister(){const v=id=>$('#'+id).value.trim(),n=v('rn'),e=v('re').toLowerCase(),ph=v('rph'),a=v('ra'),pin=v('rpin'),p=$('#rp').value;
 if(n.length<2)return fmsg('Enter your full name');if(!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(e))return fmsg('Enter a valid email');if(!/^[6-9]\d{9}$/.test(ph))return fmsg('Mobile must be a 10-digit Indian number');
 if(a.length<5)return fmsg('Enter your delivery address');if(!/^\d{6}$/.test(pin))return fmsg('PIN must be 6 digits');if(!pwOk(p))return fmsg('Password needs 8+ characters with letters and digits');if(p!=$('#rp2').value)return fmsg('Passwords do not match');
 if(DB.users.some(u=>u.email.toLowerCase()==e))return fmsg('That email is already registered');
 const id=Math.max(...DB.users.map(u=>u.id))+1,city=$('#rc').value;DB.users.push({id,name:n,email:e,role:'customer',city,phone:ph,redeemed:0,pw:await hpw(p,'s'+Math.random().toString(36).slice(2,8))});
 DB.conn.push({id:Math.max(...DB.conn.map(c=>c.id))+1,uid:id,addr:a,pin});save();authView('login');toast('Account created. Please sign in.')}
function doForgot(){const e=$('#fe').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(e))return fmsg('Enter a valid email');
 const u=DB.users.find(x=>x.email.toLowerCase()==e);let code=null;
 if(u){code=String(100000+Math.floor((typeof crypto!=='undefined'&&crypto.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]/4294967296:Math.random())*900000));DB.resets=DB.resets.filter(r=>r.email!=e);DB.resets.push({email:e,code,exp:Date.now()+9e5,tries:0});save()}
 authView('reset',{email:e,inbox:code})}
async function doReset(){const e=$('#fe2').value.trim().toLowerCase(),c=$('#fc').value.trim(),p=$('#fp').value,r=DB.resets.find(x=>x.email==e);
 if(!r||r.exp<Date.now())return fmsg('Invalid or expired code. Request a new one.');if(r.tries>=5){DB.resets=DB.resets.filter(x=>x!=r);save();return fmsg('Too many wrong attempts. Request a new code.')}
 if(c!==r.code){r.tries++;save();return fmsg('Incorrect code ('+(5-r.tries)+' attempts left)')}
 if(!pwOk(p))return fmsg('Password needs 8+ characters with letters and digits');if(p!=$('#fp2').value)return fmsg('Passwords do not match');
 const u=DB.users.find(x=>x.email.toLowerCase()==e);u.pw=await hpw(p,'s'+Math.random().toString(36).slice(2,8));DB.resets=DB.resets.filter(x=>x!=r);delete LOCK[e];ME=null;audit('PASSWORD_RESET '+u.id);save();authView('login');toast('Password updated. Please sign in.')}

const CATS=[
{key:'Processes',name:'Processes',icon:'🧩',blurb:'How GasGrid jobs are created, scheduled, blocked, suspended and terminated.',groups:[{title:'Process lifecycle',cards:[
 {id:'life',title:'Process Lifecycle & PCB',desc:'Create booking, service and report jobs and move them through the process states.',custom:'life',info:I('A process is a program in execution. The Process Control Block (PCB) stores its PID, state, priority, burst time and resource needs. States are New, Ready, Running, Waiting, Suspended and Terminated.','A new process is admitted to Ready, the dispatcher gives the CPU to one Ready process (Running), a blocked process waits for a resource until it is woken, a suspended process is swapped out until resumed, and termination releases its resources.','Every submitted job (a booking waits for STOCK, a service job waits for a TECHNICIAN, a report waits for an EVENT) is modelled as a process record. The process_management.c engine enforces the legal transitions and rejects illegal ones.','Buttons act on one process. New jobs get a random type, burst (1-8) and priority (1-3). Only one process can be Running at a time.')},
 {id:'threads',title:'Threading Models',desc:'Compare how user threads map to kernel threads.',body:tbl(['Model','Mapping','Strength','Weakness'],[['Many-to-one','many user → 1 kernel','cheap thread management','one blocking call blocks all'],['One-to-one','1 user → 1 kernel','true parallelism','one kernel thread per user thread'],['Many-to-many','n user → m kernel','flexible','complex scheduling']]),info:I('A threading model defines how user-level threads are mapped to kernel-level threads that the OS can actually schedule.','Many-to-one multiplexes all user threads on one kernel thread; one-to-one gives each user thread its own kernel thread; many-to-many multiplexes n user threads over m kernel threads.','GasGrid itself uses one-to-one style threads in its Java server (each request handled by a pool thread). This card is a teaching panel only; no real threads are created.','No inputs. Read the table.')}]}]},
{key:'CPU Scheduling',name:'CPU Scheduling',icon:'⚙️',blurb:'Eight scheduling algorithms. Edit the shared process set once, then run any card (or compare them all).',groups:[{title:'Algorithms',shared:[F('procs','Processes: pid arrival burst priority (one per line)',SAMPLEP,{area:1,rows:5})],cards:[
 cpuCard('fcfs','FCFS','FCFS','First-Come First-Served: run in arrival order.',I('First-Come First-Served runs processes strictly in arrival order and never interrupts them. It is the simplest scheduler and the baseline others are compared with.','The ready queue is a FIFO list. The process at the head gets the CPU and keeps it until its burst finishes. A long job at the front delays every short job behind it (the convoy effect).','Models booking and report jobs handled in the order customers submit them. The tick loop in cpu_scheduling.c picks the ready job with the earliest arrival time.',SHARE+' Only arrival and burst matter here.')),
 cpuCard('sjf','SJF','SJF','Shortest Job First (non-preemptive).',I('Shortest Job First runs the ready process with the smallest burst to completion. It gives the lowest average waiting time of any non-preemptive policy.','When the CPU becomes free, scan the ready processes and choose the smallest burst (ties go to the earlier arrival). Long jobs can starve if short jobs keep arriving.','A quick single-cylinder booking validation runs before a heavy monthly report, so most customers wait less.',SHARE+' Burst decides the order; arrival decides who is eligible.')),
 cpuCard('srtf','SRTF','SRTF','Shortest Remaining Time First (preemptive SJF).',I('Shortest Remaining Time First is the preemptive version of SJF. It minimises average waiting time but causes more context switches.','Every tick, compare the remaining time of all ready processes. If a newly arrived process has less remaining time than the running one, it preempts the CPU and the old process goes back to the ready queue.','Short urgent bookings interrupt long report generation; the report resumes afterwards with its remaining time intact.',SHARE+' Arrival and burst are used; remaining time is tracked per process.')),
 cpuCard('prio','Priority (non-preemptive)','PRIORITY','Highest priority first, runs to completion.',I('Priority scheduling gives the CPU to the ready process with the highest priority (lowest number). Low-priority jobs can starve unless aging is added.','When the CPU is free, pick the ready process with the smallest priority number (ties go to earlier arrival). The chosen process keeps the CPU until it finishes.','Priority 1 = gas-leak service, 2 = refill bookings, 3+ = reports. Urgent safety work is always chosen first.',SHARE+' The priority column is used; lower number = more urgent.')),
 cpuCard('priop','Priority (preemptive)','PRIORITY_P','A higher-priority arrival takes the CPU at once.',I('Preemptive priority scheduling lets a newly arrived higher-priority process interrupt the running one immediately.','Every tick the scheduler compares priorities of all ready processes. If a more urgent one exists, the running process is preempted and returns to the ready set.','A gas-leak emergency (priority 1) interrupts a routine refill job (priority 3) and gets the dispatcher right away.',SHARE+' The priority column is used; lower number = more urgent.')),
 cpuCard('rr','Round Robin','RR','Fixed time slices in a circular queue.',I('Round Robin gives each process a fixed time quantum, then moves it to the back of the queue. It is fair and gives good response time.','Take the head of the queue, run it for min(quantum, remaining) ticks, and if it is unfinished put it at the tail. A tiny quantum wastes time switching; a huge quantum behaves like FCFS.','Shares the dispatch engine fairly among many customers so nobody waits behind one big request.',SHARE+' Quantum: whole number of ticks, 1 to 100.'),true),
 cpuCard('mlq','Multilevel Queue','MLQ','Fixed queues by job class.',I('A Multilevel Queue splits processes permanently into separate queues by class, each queue with its own policy. Queues are served in strict priority order.','Q1 (priority 1, Round Robin quantum 2) is always served before Q2 (priority 2, Round Robin quantum 4), which is served before Q3 (priority 3+, FCFS). A lower queue runs only when all higher queues are empty and a new arrival in a higher queue preempts it.','Q1 = urgent service, Q2 = standard refill, Q3 = reporting. The same logic is in cpu_scheduling.c.',SHARE+' The priority column chooses the queue (1, 2, or 3 and above). Quanta are fixed at 2 and 4.')),
 cpuCard('mlfq','Multilevel Feedback Queue','MLFQ','Jobs move between queues based on behaviour.',I('A Multilevel Feedback Queue lets processes move between queues, so the scheduler adapts to how long each job really runs.','Every process starts in Q1 (quantum 2). A process that uses its full quantum is demoted to Q2 (quantum 4) and then to Q3 (FCFS). Short jobs finish quickly in the top queue while long jobs sink to lower queues.','New bookings and service jobs start with high responsiveness; heavy report jobs gradually drop to the background queue.',SHARE+' The priority column is ignored: every job starts in Q1.')),
 {id:'cmp',title:'Compare All Algorithms',desc:'Run all eight on the same process set.',info:I('A side-by-side comparison of every scheduler on identical input, using the standard criteria: average waiting time, average turnaround time, CPU utilization and throughput.','Each algorithm is simulated on the shared process set. The row with the lowest average waiting time is highlighted in green.','Admins use this to decide which dispatch policy suits the current mix of urgent, refill and report jobs.',SHARE+' Quantum applies to Round Robin only.'),fields:[F('q','Time quantum (ticks)',2,{s:1})],run:(v,S)=>{const P=parseProcs(S.procs),q=qOf(v),rows=['FCFS','SJF','SRTF','PRIORITY','PRIORITY_P','RR','MLQ','MLFQ'].map(a=>{const r=cpuSim(a,P,q);return[a,r.wt.toFixed(2),r.tat.toFixed(2),r.util.toFixed(1)+'%',r.thr.toFixed(3)]}),b=Math.min(...rows.map(r=>+r[1]));return{html:tbl(['Algorithm','Avg waiting','Avg turnaround','CPU util','Throughput'],rows.map(r=>r.map((c,i)=>i==1&&+c==b?`<b class=DELIVERED>${c}</b>`:c))),sum:'Compared 8 algorithms on '+P.length+' processes'}}}]}]},
{key:'Synchronization',name:'Synchronization',icon:'🔒',blurb:'Protecting shared data such as the stock counter when many bookings arrive at once.',groups:[{title:'Race conditions and locks',cards:[
 taskC('race','Race Condition','Two simultaneous bookings, no protection.',I('A race condition happens when threads read-modify-write shared data and the result depends on timing. Here two bookings update the same stock counter.','Both bookings read stock=N before either writes back. Both write N-1, so one decrement is lost. With one cylinder left, both customers get a confirmation: overselling.','This is the bug GasGrid avoids. Inventory changes are protected by a lock (see Mutex Lock); the Oracle version uses a row lock with SELECT ... FOR UPDATE.','Starting stock: a whole number from 1 to 1000.'),[F('stock','Starting stock',1,{s:1})],v=>{const s=+v.stock;if(!Number.isInteger(s)||s<1||s>1000)throw 'Stock must be 1 to 1000';const r=raceSim(s,0);return{html:traceH(r.t)+verdict(false,`Sold ${r.sold}, stock recorded ${r.fin}. ${r.over?'<b>OVERSOLD:</b> more cylinders sold than existed.':'<b>LOST UPDATE:</b> stock should be '+(s-r.sold)+'.'}`),sum:`unsafe run, stock ${s}: ${r.over?'oversold':'lost update'}`}}),
 taskC('mutex','Mutex Lock','The same two bookings, protected.',I('A mutex (mutual exclusion lock) lets only one thread at a time execute a critical section.','Each booking acquires the lock, reads the stock, writes the new value and releases the lock. The second booking waits, then sees the updated stock and is rejected if it is 0.','Every GasGrid booking does lock(inventory) → check stock → decrement → unlock. The stored procedure sp_book_cylinder gets the same effect in Oracle with a row lock.','Starting stock: a whole number from 1 to 1000.'),[F('stock','Starting stock',1,{s:1})],v=>{const s=+v.stock;if(!Number.isInteger(s)||s<1||s>1000)throw 'Stock must be 1 to 1000';const r=raceSim(s,1);return{html:traceH(r.t)+verdict(true,`Sold ${r.sold}, stock recorded ${r.fin}. Consistent: no overselling.`),sum:`mutex run, stock ${s}: ${r.sold} sold`}}),
 taskC('sem','Counting Semaphore','Cylinders as a pool of identical units.',I('A counting semaphore holds a number of identical resource units. P (wait) takes one unit, V (signal) returns one.','P decrements the counter if it is above 0, otherwise the caller blocks. V wakes one blocked caller if any, otherwise increments the counter.','The stock of a cylinder type is a counting semaphore: a booking is P, a cancellation or restock is V. A blocked booking is one waiting for stock.','Initial units (0-100) and an operation string of P and V, for example PPPPV.'),[F('units','Initial units',3,{s:1}),F('ops','Operations (P/V)','PPPPVP')],v=>{const u=+v.units;if(!Number.isInteger(u)||u<0||u>100)throw 'Units must be 0 to 100';const o=v.ops.trim().toUpperCase();if(!o||o.length>60)throw 'Enter 1 to 60 operations';const r=semSim(u,[...o]);return{html:traceH(r.t)+`<p class=sum>Final units <b>${r.v}</b> · blocked bookings <b>${r.w}</b></p>`,sum:`semaphore ${o}: ${r.v} units, ${r.w} blocked`}}),
 taskC('pet','Peterson\'s Solution','Software-only mutual exclusion for two processes.',I('Peterson\'s solution gives mutual exclusion between two processes using only shared variables, with no special hardware instruction.','Each process sets flag[i]=1 and turn=other, then waits while flag[other] is 1 and turn is other. After the critical section it sets flag[i]=0. It guarantees mutual exclusion, progress and bounded waiting.','An educational demo with its own counter, separate from live inventory. synchronization.c steps the two processes alternately and checks that the shared counter is correct.','Iterations per process: 1 to 200.'),[F('n','Iterations',50,{s:1})],v=>{const n=+v.n;if(!Number.isInteger(n)||n<1||n>200)throw 'Iterations must be 1 to 200';const r=lockSim('peterson',n);return{html:traceH(r.t)+verdict(r.cnt==r.exp&&!r.viol,`Counter ${r.cnt} (expected ${r.exp}), mutual-exclusion violations ${r.viol}.`),sum:`Peterson ${n} iterations: counter ${r.cnt}/${r.exp}`}}),
 taskC('tas','TestAndSet / CompareAndSwap','Hardware atomic instructions as locks.',I('TestAndSet and CompareAndSwap are atomic CPU instructions that let software build locks safely.','TestAndSet sets the lock to 1 and returns its old value in one indivisible step; a process enters only if it got 0. CompareAndSwap(lock,0,1) changes the lock only if it is still 0. "No lock" shows the lost updates that happen without protection.','Shows how the booking mutex is built underneath: lock acquisition must be atomic or two bookings could both succeed.','Mode (TestAndSet, CompareAndSwap or No lock) and iterations per process (1 to 200).'),[F('mode','Mode','tas',{sel:[['tas','TestAndSet'],['cas','CompareAndSwap'],['none','No lock']]}),F('n','Iterations',50,{s:1})],v=>{const n=+v.n;if(!Number.isInteger(n)||n<1||n>200)throw 'Iterations must be 1 to 200';if(!['tas','cas','none'].includes(v.mode))throw 'Unknown mode';const r=lockSim(v.mode,n);return{html:traceH(r.t)+verdict(r.cnt==r.exp&&!r.viol,`Counter ${r.cnt} (expected ${r.exp}), violations ${r.viol}.`),sum:`${v.mode.toUpperCase()}: counter ${r.cnt}/${r.exp}`}}),
 taskC('pc','Producer–Consumer','Bounded buffer between bookings and dispatch.',I('The producer-consumer problem coordinates a producer that adds items and a consumer that removes them through a fixed-size buffer.','The producer blocks when the buffer is full and the consumer blocks when it is empty. Together a mutex and two semaphores (empty slots, full slots) keep the buffer consistent.','Booking requests are producers, the dispatch worker is the consumer and the queue capacity is the buffer size.','Buffer capacity (1-50) and operations: P = produce a booking, C = consume (dispatch).'),[F('cap','Capacity',3,{s:1}),F('ops','Operations (P/C)','PPPPCCCPCCC')],v=>{const c=+v.cap;if(!Number.isInteger(c)||c<1||c>50)throw 'Capacity must be 1 to 50';const o=v.ops.trim().toUpperCase();if(!o||o.length>60)throw 'Enter 1 to 60 operations';const r=pcSim(c,[...o]);return{html:traceH(r.t)+`<p class=sum>In buffer <b>${r.c}/${c}</b> · produced ${r.p} · consumed ${r.k}</p>`,sum:`bounded buffer ${o}: ${r.p} produced, ${r.k} consumed`}}),
 taskC('rw','Readers–Writers','Many report readers, one exclusive stock writer.',I('The readers-writers problem lets many readers share data but gives a writer exclusive access.','Consecutive readers run together. A writer waits until no reader is active and then blocks everyone else. This card uses reader preference.','Many users and admins can read stock reports at the same time; a restock update takes exclusive access.','Request sequence of R (reader) and W (writer), up to 40 characters, e.g. RRWRRW.'),[F('seq','Sequence (R/W)','RRWRRWR')],v=>{const s=v.seq.trim().toUpperCase();if(!s||s.length>40)throw 'Enter 1 to 40 characters';const r=rwSim([...s]);return{html:traceH(r.t)+`<p class=sum>${r.r} reads, ${r.w} exclusive writes</p>`,sum:`readers-writers ${s}`}}),
 taskC('dine','Dining Philosophers','Circular wait and how ordering prevents it.',I('Dining Philosophers is the classic circular-wait example: each philosopher needs two forks and each fork is shared with a neighbour.','Naive strategy: everyone picks the left fork first, then waits for the right fork forever (deadlock). Ordered strategy: every philosopher picks the lower-numbered fork first, which breaks the circular wait.','A generic resource-sharing simulation, not tied to customer data. It mirrors jobs that each need both a vehicle and a technician.','Philosophers (2-10), strategy (Naive or Ordered) and rounds (1-20, ordered only).'),[F('n','Philosophers',5,{s:1}),F('st','Strategy','NAIVE',{sel:[['NAIVE','Naive (left first)'],['ORDERED','Ordered forks']]}),F('r','Rounds',2,{s:1})],v=>{const n=+v.n,r=+v.r;if(!Number.isInteger(n)||n<2||n>10)throw 'Philosophers must be 2 to 10';if(!Number.isInteger(r)||r<1||r>20)throw 'Rounds must be 1 to 20';const d=dineSim(n,v.st,r);return{html:traceH(d.t.slice(0,60))+verdict(!d.dead,d.dead?'Deadlock: nobody can eat.':`No deadlock: ${d.meals} meals served.`),sum:`dining ${v.st}: ${d.dead?'deadlock':d.meals+' meals'}`}})]}]},
{key:'Deadlocks',name:'Deadlocks',icon:'⛓️',blurb:'Detecting, avoiding and recovering from deadlocks among cylinders, vehicles and technician slots.',groups:[{title:'Avoidance, detection and prevention',cards:[
 taskC('bank','Banker\'s Algorithm','Safety check and resource-request test.',I('The Banker\'s Algorithm avoids deadlock by granting a request only if the resulting state is still safe, meaning every process can finish in some order.','Need = Max - Allocation. Safety check: repeatedly find a process whose Need is within the available Work, assume it finishes and returns its Allocation. If all finish, the order found is a safe sequence. A request must be within Need and Available, is granted tentatively, and is kept only if the new state is safe.','Resources are cylinders, vehicles and technician slots. A dispatch request is approved only if every job can still complete.','Available (one row), Max matrix, Allocation matrix (one row per process), and an optional request as: process number followed by the request vector, e.g. 1 1 0 2.'),[F('avail','Available',BAN.avail),F('max','Max matrix',BAN.max,{area:1,rows:5}),F('alloc','Allocation matrix',BAN.alloc,{area:1,rows:5}),F('req','Request (pid then vector, optional)','1 1 0 2')],v=>{const av=nums(v.avail,0,1e6,6,'Available'),m=av.length,mx=mat(v.max,m,'Max'),al=mat(v.alloc,m,'Allocation');if(mx.length!=al.length)throw 'Max and Allocation need the same number of rows';if(mx.some((r,i)=>r.some((x,j)=>x<al[i][j])))throw 'Max must be at least Allocation in every cell';

{key:'Memory',name:'Memory',icon:'💾',blurb:'Contiguous allocation, paging and page replacement.',groups:[

{title:'Page replacement',shared:[F('refs','Reference string','1 2 3 4 1 2 5 1 2 3 4 5'),F('frames','Frames',3,{s:1})],cards:[
 pgCard('fifo','FIFO','FIFO','Replace the oldest page.',I('FIFO page replacement evicts the page that has been in memory the longest.','Frames work like a queue. On a fault with all frames full, the oldest page is replaced. It is simple but can evict a heavily used page, and can show Belady\'s anomaly (more frames, more faults).','Models which stock-report pages stay in memory for the dashboards. The card also repeats the run with one more frame to check for the anomaly.','Shared inputs: reference string (page numbers 0-999) and number of frames (1-8).')),

 pgCard('opt','Optimal','OPT','Replace the page used farthest in future.',I('Optimal replacement evicts the page that will not be used for the longest time. It gives the fewest possible faults but needs knowledge of the future.','On a fault, look ahead in the reference string and evict the resident page whose next use is farthest away (or never).','Not usable in a live system; used as a benchmark to judge how good FIFO, LRU and the others are.','Shared inputs: reference string and frames.')),
 pgCard('clock','Second Chance (Clock)','CLOCK','FIFO with a reference bit.',I('Second Chance (Clock) improves FIFO by giving recently used pages another chance before eviction.','Pages sit in a circle with a reference bit. The hand skips pages whose bit is 1 (clearing it) and evicts the first page whose bit is 0. Hits set the bit to 1.','A cheap approximation of LRU, as used by real operating systems, applied to the GasGrid page model.','Shared inputs: reference string and frames.')),
 pgCard('lfu','LFU','LFU','Replace the least frequently used page.',I('Least Frequently Used evicts the page with the fewest references since it was loaded.','Keep a counter per resident page, increment on every hit, and evict the lowest count (ties go to the page loaded earliest). A page that was popular long ago can stay forever.','Keeps the most popular dashboard pages resident.','Shared inputs: reference string and frames.')),

 if(OC=='Processes')lifeRender()}

const JOBS=[['Booking','STOCK'],['Service','TECHNICIAN'],['Report','EVENT']],PA={NEW:[['admit','Admit']],READY:[['dispatch','Dispatch'],['suspend','Suspend']],RUNNING:[['block','Block'],['preempt','Preempt'],['kill','Terminate']],WAITING:[['wake','Wake'],['suspend','Suspend']],SUSPENDED:[['resume','Resume']],TERMINATED:[]},PT={admit:'READY',dispatch:'RUNNING',block:'WAITING',wake:'READY',preempt:'READY',suspend:'SUSPENDED',resume:'READY',kill:'TERMINATED'};

 const S=Object.keys(PA);el.innerHTML=`<div class=chips>${S.map(s=>`<span class="chip st_${s}">${s} <b>${PL.filter(p=>p.st==s).length}</b></span>`).join('')}</div>`+tbl(['PID','Job','State','Burst','Pri','Needs','Reason','Action'],PL.map(p=>[p.pid,p.job,`<b>${p.st}</b>`,p.burst,p.pri,p.res,p.why||'-',PA[p.st].map(([a,l])=>`<button class="${a=='kill'?'d':'s'}" onclick="pcAct(${p.pid},'${a}')">${l}</button>`).join(' ')]))+`<div class=acts><button onclick=pcAdd()>+ New process</button><button class=s onclick="PL=[];PID=1;lifeRender()">Reset</button></div><div class=trc2>${PLOG.slice(0,5).map(esc).join('<br>')}</div>`}
