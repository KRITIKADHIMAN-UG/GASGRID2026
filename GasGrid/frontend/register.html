<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GasGrid | Register</title><link rel="stylesheet" href="/static/css/style.css"></head><body class="auth-page"><main class="auth-card"><div class="brand-mark">G</div><h1>Create account</h1><p class="muted">Register as a GasGrid customer</p><form id="registerForm"><label>Full name<input name="name" required minlength="2" maxlength="60"></label><label>Mobile number<input name="phone" inputmode="numeric" maxlength="10" required></label><label>Address<textarea name="address" required minlength="5" maxlength="160"></textarea></label><label>Password<input name="password" type="password" required minlength="8"><small>8-40 characters, with letters and numbers.</small></label><button class="primary" type="submit">Create account</button><p id="message" class="message"></p></form><p>Already registered? <a href="/login">Sign in</a></p></main><script src="/static/js/app.js"></script></body></html>
